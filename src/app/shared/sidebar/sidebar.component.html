<div class="d-flex" id="wrapper">
  <!-- Sidebar Container -->
  <div
    class="bg-dark text-white border-end"
    id="sidebar-wrapper"
    [ngClass]="{ collapsed: isCollapsed }"
  >
    <div class="sidebar-heading text-center py-4 border-bottom fs-4 fw-bold">
      <span *ngIf="!isCollapsed">Pan Attar</span>
      <span *ngIf="isCollapsed">PA</span>
    </div>

    <div class="list-group list-group-flush my-3">
      <!-- Dashboard Link -->
      <ng-container *ngFor="let item of menu">
        <a
          [routerLink]="item.link"
          routerLinkActive="active"
          class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold"
        >
          <i class="bi {{ item.icon }} me-2"></i>
          <span *ngIf="!isCollapsed">{{ item.label }}</span>
        </a>
      </ng-container>
      <button
        type="button"
        (click)="logout()"
        [attr.title]="isCollapsed ? 'Logout' : null"
        [class.text-center]="isCollapsed"
        [class.text-start]="!isCollapsed"
        [attr.aria-label]="isCollapsed ? 'Logout' : null"
        class="list-group-item list-group-item-action bg-transparent text-white second-text fw-bold"
      >
        <i class="bi bi-box-arrow-right" [class.me-2]="!isCollapsed" aria-hidden="true"></i>
        <span *ngIf="!isCollapsed">Logout</span>
      </button>
    </div>
  </div>

  <!-- Page Content Container -->
  <div id="page-content-wrapper">
    <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-4 px-4">
      <div class="d-flex align-items-center">
        <!-- Toggle Trigger Button -->
        <button class="btn btn-primary" (click)="toggleSidebar()">
          <i class="bi bi-justify"></i>
        </button>
      </div>
      <!-- <div class="page-brand">
        <img src="/assets/rich-mukhwas-logo.jpg" alt="Rich Mukhwas & more" />
      </div> -->
    </nav>

    <!-- App view injected here -->
    <div class="container-fluid px-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
