<nav mat-tab-nav-bar [tabPanel]="reportPanel" aria-label="Report sections">
  <a
    *ngFor="let tab of reportTabs"
    mat-tab-link
    [routerLink]="tab.path"
    routerLinkActive
    #activeTab="routerLinkActive"
    [active]="activeTab.isActive"
  >
    {{ tab.label }}
  </a>
</nav>
<mat-tab-nav-panel #reportPanel>
  <router-outlet />
</mat-tab-nav-panel>
