<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <div>
      <h4 class="mb-0">Categories</h4>
      <small class="text-muted">{{ total() }} total</small>
    </div>
    <button mat-flat-button color="primary" type="button" routerLink="/app/categories/create">
      <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>
      Add Category
    </button>
  </div>

  <div class="card-body border-bottom d-flex align-items-center gap-3">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search flex-grow-1">
      <mat-label>Search categories</mat-label>
      <input matInput [formControl]="search" placeholder="Name or description" />
    </mat-form-field>
    <button
      mat-stroked-button
      type="button"
      class="flex-shrink-0"
      [disabled]="!hasSearch"
      (click)="clearSearch()"
    >
      Clear
    </button>
  </div>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <div class="table-responsive">
    <table
      mat-table
      matSort
      [dataSource]="dataSource"
      [matSortActive]="sortHeader()"
      [matSortDirection]="sortDirection() === 'ASC' ? 'asc' : 'desc'"
      (matSortChange)="onSort($event)"
      class="w-100"
    >
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let category" class="fw-semibold">{{ category.title }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let category">{{ category.description || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let category">
          <button
            mat-icon-button
            type="button"
            [routerLink]="['/app/categories', category._id, 'edit']"
            [attr.aria-label]="'Edit ' + category.name"
            [attr.title]="'Edit ' + category.name"
          >
            <i class="bi bi-pencil" aria-hidden="true"></i>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row">
        <td
          class="mat-cell text-center text-muted p-4"
          [attr.colspan]="displayedColumns.length"
          *matNoDataRow
        >
          No categories found.
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator
    [length]="total()"
    [pageIndex]="page() - 1"
    [pageSize]="limit()"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (page)="onPage($event)"
    showFirstLastButtons
  />
</div>
