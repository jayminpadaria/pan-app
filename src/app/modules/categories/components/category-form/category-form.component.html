<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <h4 class="mb-0">{{ isEdit() ? 'Edit Category' : 'Create Category' }}</h4>
    <button mat-stroked-button type="button" routerLink="/app/categories">
      Back to categories
    </button>
  </div>

  <div class="card-body">
    @if (loadingCategory()) {
      <mat-progress-bar mode="indeterminate" />
    } @else {
      <form [formGroup]="form" (ngSubmit)="saveCategory()" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="title" class="form-label">Category name</label>
            <input
              id="title"
              class="form-control"
              formControlName="title"
              [class.is-invalid]="isInvalid('title')"
            />
            <div class="invalid-feedback">Category name is required.</div>
          </div>

          <div class="col-12">
            <label for="description" class="form-label">Description</label>
            <textarea
              id="description"
              class="form-control"
              rows="3"
              formControlName="description"
            ></textarea>
          </div>
        </div>

        <div class="mt-4 d-flex justify-content-end">
          <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
            {{
              saving()
                ? isEdit()
                  ? 'Saving...'
                  : 'Creating...'
                : isEdit()
                  ? 'Save Changes'
                  : 'Create Category'
            }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
