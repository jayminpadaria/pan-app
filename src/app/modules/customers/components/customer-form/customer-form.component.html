<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <h4 class="mb-0">{{ isEdit() ? 'Edit Customer' : 'Create Customer' }}</h4>
    <button mat-stroked-button type="button" routerLink="/app/customers">Back to customers</button>
  </div>

  <div class="card-body">
    @if (loadingCustomer()) {
      <mat-progress-bar mode="indeterminate" />
    } @else {
      <form [formGroup]="form" (ngSubmit)="saveCustomer()" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="firstName" class="form-label">First name</label>
            <input
              id="firstName"
              class="form-control"
              formControlName="firstName"
              [class.is-invalid]="isInvalid('firstName')"
            />
            <div class="invalid-feedback">First name is required.</div>
          </div>

          <div class="col-md-6">
            <label for="lastName" class="form-label">Last name</label>
            <input
              id="lastName"
              class="form-control"
              formControlName="lastName"
              [class.is-invalid]="isInvalid('lastName')"
            />
            <div class="invalid-feedback">Last name is required.</div>
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input
              id="email"
              type="email"
              class="form-control"
              formControlName="email"
              [class.is-invalid]="isInvalid('email')"
            />
            <div class="invalid-feedback">Enter a valid email address.</div>
          </div>

          <div class="col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <input
              id="phone"
              type="tel"
              class="form-control"
              formControlName="phone"
              [class.is-invalid]="isInvalid('phone')"
            />
            <div class="invalid-feedback">Phone is required.</div>
          </div>
        </div>

        <div class="mt-4 d-flex justify-content-end">
          <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
            {{
              saving()
                ? isEdit()
                  ? 'Saving...'
                  : 'Creating...'
                : isEdit()
                  ? 'Save Changes'
                  : 'Create Customer'
            }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
