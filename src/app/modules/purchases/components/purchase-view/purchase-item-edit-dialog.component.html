<h2 mat-dialog-title>Edit purchase item</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <div mat-dialog-content class="row g-3">
    <div class="col-12">
      <div class="fw-semibold">{{ data.productName }}</div>
      <small class="text-muted">{{ data.variantLabel }}</small>
    </div>

    <div class="col-sm-6">
      <label for="purchase-item-quantity" class="form-label">Quantity</label>
      <input
        id="purchase-item-quantity"
        type="number"
        min="1"
        step="1"
        class="form-control"
        formControlName="quantity"
        [class.is-invalid]="isInvalid('quantity')"
      />
      <div class="invalid-feedback">Quantity must be a whole number greater than zero.</div>
    </div>

    <div class="col-sm-6">
      <label for="purchase-item-cost-price" class="form-label">Cost per unit</label>
      <input
        id="purchase-item-cost-price"
        type="number"
        min="0"
        step="0.01"
        class="form-control"
        formControlName="costPrice"
        [class.is-invalid]="isInvalid('costPrice')"
      />
      <div class="invalid-feedback">Cost must be zero or greater.</div>
    </div>

    <div class="col-sm-6">
      <label for="purchase-item-retail-price" class="form-label">Retail price</label>
      <input
        id="purchase-item-retail-price"
        type="number"
        min="0"
        step="0.01"
        class="form-control"
        formControlName="retailPrice"
        [class.is-invalid]="isInvalid('retailPrice') || retailPriceMustExceedCost()"
      />
      <div class="invalid-feedback">
        @if (retailPriceMustExceedCost()) {
          Retail price must be greater than cost.
        } @else {
          Retail price must be zero or greater.
        }
      </div>
    </div>

    <div class="col-sm-6">
      <label for="purchase-item-expiry-date" class="form-label">Expiry date</label>
      <input
        id="purchase-item-expiry-date"
        type="date"
        class="form-control"
        formControlName="expiryDate"
      />
    </div>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit">Save changes</button>
  </div>
</form>
