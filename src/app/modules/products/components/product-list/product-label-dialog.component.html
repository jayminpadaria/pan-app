<h2 mat-dialog-title>Print variant label</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <div mat-dialog-content class="row g-3">
    <p class="mb-0">{{ data.productName }} — {{ data.sku }}</p>

    <div class="col-12">
      <label for="label-batch-number" class="form-label">Batch number</label>
      <input
        id="label-batch-number"
        class="form-control"
        formControlName="batchNumber"
        [class.is-invalid]="isInvalid('batchNumber')"
      />
      <div class="invalid-feedback">Batch number is required.</div>
    </div>

    <div class="col-12">
      <label for="label-mfd-date" class="form-label">Manufacturing date</label>
      <input
        id="label-mfd-date"
        type="date"
        class="form-control"
        formControlName="mfdDate"
        [class.is-invalid]="isInvalid('mfdDate')"
      />
      <div class="invalid-feedback">Manufacturing date is required.</div>
    </div>

    <div class="col-12">
      <label for="label-exp-date" class="form-label">Expiry date</label>
      <input
        id="label-exp-date"
        type="date"
        class="form-control"
        formControlName="expDate"
        [class.is-invalid]="isInvalid('expDate')"
      />
      <div class="invalid-feedback">Expiry date is required.</div>
    </div>

    <div class="col-12">
      <label for="label-mrp" class="form-label">MRP</label>
      <input
        id="label-mrp"
        type="number"
        min="0.01"
        step="0.01"
        class="form-control"
        formControlName="mrp"
        [class.is-invalid]="isInvalid('mrp')"
      />
      <div class="invalid-feedback">MRP must be greater than zero.</div>
    </div>

    <div class="col-12">
      <label for="label-print-qty" class="form-label">Print quantity</label>
      <input
        id="label-print-qty"
        type="number"
        min="1"
        step="1"
        class="form-control"
        formControlName="printQty"
        [class.is-invalid]="isInvalid('printQty')"
      />
      <div class="invalid-feedback">Print quantity must be a positive whole number.</div>
    </div>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit">Print label</button>
  </div>
</form>
