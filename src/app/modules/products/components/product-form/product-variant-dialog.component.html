<h2 mat-dialog-title>{{ title }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <div mat-dialog-content class="row g-3">
    <div class="col-sm-6">
      <label for="variant-dialog-sku" class="form-label">SKU</label>
      <input
        id="variant-dialog-sku"
        class="form-control"
        formControlName="sku"
        [class.is-invalid]="isInvalid('sku')"
      />
      <div class="invalid-feedback">SKU is required.</div>
    </div>

    <div class="col-sm-6">
      <label for="variant-dialog-weight" class="form-label">Weight</label>
      <input
        id="variant-dialog-weight"
        type="number"
        min="0"
        class="form-control"
        formControlName="weight"
        [class.is-invalid]="isInvalid('weight')"
      />
      <div class="invalid-feedback">Weight must be zero or greater.</div>
    </div>

    <div class="col-sm-6">
      <label for="variant-dialog-unit" class="form-label">Unit</label>
      <select
        id="variant-dialog-unit"
        class="form-select"
        formControlName="unit"
        [class.is-invalid]="isInvalid('unit')"
      >
        <option value="">Select a unit</option>
        <option value="gram">Gram</option>
        <option value="kg">Kg</option>
      </select>
      <div class="invalid-feedback">Unit is required.</div>
    </div>

    <div class="col-12">
      <label for="variant-dialog-size" class="form-label">Size label</label>
      <input
        id="variant-dialog-size"
        class="form-control"
        formControlName="sizeLabel"
        [class.is-invalid]="isInvalid('sizeLabel')"
      />
      <div class="invalid-feedback">Size label is required.</div>
    </div>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit">
      {{ data.variant ? 'Update' : 'Add' }}
    </button>
  </div>
</form>
