<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <div>
      <h4 class="mb-0">Suppliers</h4>
      <small class="text-muted">{{ total() }} total</small>
    </div>
    <button mat-flat-button color="primary" type="button" routerLink="/app/suppliers/create">
      <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>
      Add Supplier
    </button>
  </div>

  <div class="card-body border-bottom d-flex align-items-center gap-3">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search flex-grow-1">
      <mat-label>Search suppliers</mat-label>
      <input matInput [formControl]="search" placeholder="Company, contact, email or phone" />
    </mat-form-field>
    <button
      mat-stroked-button
      type="button"
      class="flex-shrink-0"
      [disabled]="!hasSearch"
      (click)="clearSearch()"
    >
      Clear
    </button>
  </div>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <div class="table-responsive">
    <table
      mat-table
      matSort
      [dataSource]="dataSource"
      [matSortActive]="sortHeader()"
      [matSortDirection]="sortDirection() === 'ASC' ? 'asc' : 'desc'"
      (matSortChange)="onSort($event)"
      class="w-100"
    >
      <ng-container matColumnDef="companyName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Company</th>
        <td mat-cell *matCellDef="let supplier" class="fw-semibold">{{ supplier.companyName }}</td>
      </ng-container>

      <ng-container matColumnDef="contactName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Contact</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.contactName }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.email }}</td>
      </ng-container>

      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.phone }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let supplier">
          <span class="badge" [class.text-bg-success]="supplier.isActive !== false"
            [class.text-bg-secondary]="supplier.isActive === false">
            {{ supplier.isActive === false ? 'Inactive' : 'Active' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let supplier">
          <button
            mat-icon-button
            type="button"
            [routerLink]="['/app/suppliers', supplier._id, 'edit']"
            [attr.aria-label]="'Edit ' + supplier.companyName"
            [attr.title]="'Edit ' + supplier.companyName"
          >
            <i class="bi bi-pencil" aria-hidden="true"></i>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row">
        <td
          class="mat-cell text-center text-muted p-4"
          [attr.colspan]="displayedColumns.length"
          *matNoDataRow
        >
          No suppliers found.
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator
    [length]="total()"
    [pageIndex]="page() - 1"
    [pageSize]="limit()"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (page)="onPage($event)"
    showFirstLastButtons
  />
</div>
