<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <h4 class="mb-0">{{ isEdit() ? 'Edit Supplier' : 'Create Supplier' }}</h4>
    <button mat-stroked-button type="button" routerLink="/app/suppliers">Back to suppliers</button>
  </div>

  <div class="card-body">
    @if (loadingSupplier()) {
      <mat-progress-bar mode="indeterminate" />
    } @else {
      <form [formGroup]="form" (ngSubmit)="saveSupplier()" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="companyName" class="form-label">Company name</label>
            <input
              id="companyName"
              class="form-control"
              formControlName="companyName"
              [class.is-invalid]="isInvalid('companyName')"
            />
            <div class="invalid-feedback">Company name is required.</div>
          </div>

          <div class="col-md-6">
            <label for="contactName" class="form-label">Contact name</label>
            <input
              id="contactName"
              class="form-control"
              formControlName="contactName"
              [class.is-invalid]="isInvalid('contactName')"
            />
            <div class="invalid-feedback">Contact name is required.</div>
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input
              id="email"
              type="email"
              class="form-control"
              formControlName="email"
              [class.is-invalid]="isInvalid('email')"
            />
            <div class="invalid-feedback">Enter a valid email address.</div>
          </div>

          <div class="col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <input
              id="phone"
              type="tel"
              class="form-control"
              formControlName="phone"
              [class.is-invalid]="isInvalid('phone')"
            />
            <div class="invalid-feedback">Phone is required.</div>
          </div>

          <div class="col-12">
            <div class="form-check">
              <input id="isActive" class="form-check-input" type="checkbox" formControlName="isActive" />
              <label for="isActive" class="form-check-label">Active supplier</label>
            </div>
          </div>
        </div>

        <div class="mt-4 d-flex justify-content-end">
          <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
            {{
              saving()
                ? isEdit()
                  ? 'Saving...'
                  : 'Creating...'
                : isEdit()
                  ? 'Save Changes'
                  : 'Create Supplier'
            }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
